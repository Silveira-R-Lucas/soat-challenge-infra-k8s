name: 'Terraform Destroy Infrastructure'

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Digite "destroy" para confirmar a exclusão de TODOS os recursos.'
        required: true

jobs:
  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
  
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3

      - name: 'Verify Confirmation'
        run: |
          if [[ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]]; then
            echo "Ação cancelada. Você precisa digitar 'destroy' para confirmar."
            exit 1
          fi

      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v2
        with:

          role-to-assume: arn:aws:iam::${{ secrets.user }}:user/${{ secrets.role }}
          aws-region: "sa-east-1"

      - name: 'Terraform Init'
        id: init
        run: terraform init

      - name: 'Terraform Destroy'
        id: destroy
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_rails_app_image_tag: ${{ vars.RAILS_APP_IMAGE_TAG }}
          TF_VAR_rails_master_key: ${{ secrets.RAILS_MASTER_KEY }}
          TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
          TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION }}
          TF_VAR_node_count: ${{ vars.NODE_COUNT }}
          TF_VAR_node_flavor: ${{ vars.NODE_FLAVOR }}
          TF_VAR_create_user_function_url: ${{ vars.CREATE_USER_FUNCTION_URL }}
          TF_VAR_identify_client_function_url: ${{ vars.IDENTIFY_CLIENT_FUNCTION_URL }}
          TF_VAR_mercadopago_secret: ${{ secrets.MERCADOPAGO_SECRET }}
          TF_VAR_mercadopago_notification_url: ${{ vars.MERCADOPAGO_NOTIFICATION_URL }}
          TF_VAR_mercadopago_external_pos_id: ${{ secrets.MERCADOPAGO_EXTERNAL_POS_ID }}
          TF_VAR_mercadopago_user_id: ${{ secrets.MERCADOPAGO_USER_ID }}
          TF_VAR_mercadopago_token: ${{ secrets.MERCADOPAGO_TOKEN }} 
        run: terraform destroy -auto-approve