name: Terraform CI/CD for Magalu Cloud
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest
    env:
      TF_VAR_mgc_api_key: ${{ secrets.MGC_ACCESS_KEY }}
      TF_VAR_mgc_secret_key: ${{ secrets.MGC_SECRET_KEY }}
      TF_VAR_rails_app_image_tag: ${{ vars.RAILS_APP_IMAGE_TAG }}
      TF_VAR_mgc_region: ${{ vars.MGC_REGION }}
      TF_VAR_mgc_availability_zone: ${{ vars.MGC_AVAILABILITY_ZONE }}
      TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
      TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION }}
      TF_VAR_node_count: ${{ vars.NODE_COUNT }}
      TF_VAR_node_flavor: ${{ vars.NODE_FLAVOR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan