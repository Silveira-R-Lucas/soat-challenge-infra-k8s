name: Terraform CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SECRET_NAME: "soat/k8s/kubeconfig"

jobs:
  terraform:
    name: 'Terraform Plan and Apply EKS'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_rails_app_image_tag: ${{ vars.RAILS_APP_IMAGE_TAG }}
      TF_VAR_rails_master_key: ${{ secrets.RAILS_MASTER_KEY }}
      TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
      TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION }}
      TF_VAR_node_count: ${{ vars.NODE_COUNT }}
      TF_VAR_node_flavor: ${{ vars.NODE_FLAVOR }}
      TF_VAR_create_user_function_url: ${{ vars.CREATE_USER_FUNCTION_URL }}
      TF_VAR_identify_client_function_url: ${{ vars.IDENTIFY_CLIENT_FUNCTION_URL }}
      TF_VAR_mercadopago_secret: ${{ secrets.MERCADOPAGO_SECRET }}
      TF_VAR_mercadopago_notification_url: ${{ vars.MERCADOPAGO_NOTIFICATION_URL }}
      TF_VAR_mercadopago_external_pos_id: ${{ secrets.MERCADOPAGO_EXTERNAL_POS_ID }}
      TF_VAR_mercadopago_user_id: ${{ secrets.MERCADOPAGO_USER_ID }}
      TF_VAR_mercadopago_token: ${{ secrets.MERCADOPAGO_TOKEN }} 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1
      
      - name: Get Database Secret from AWS Secrets Manager
        id: get-app-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            RAILS_DATABASE_URL, soat/db/database_url
            MAGALU_CR, soat/k8s/app-secrets
        
      - name: 'DEBUG: Echo DATABASE_URL as Base64'
        run: |
          echo "O valor de DATABASE_URL codificado em Base64 eh:"
          echo "${{ steps.get-app-secrets.outputs.RAILS_DATABASE_URL }}" | base64
          echo "Copie a string acima e decodifique localmente para verificar."

      - name: Parse Secrets with JQ
        id: parse-secrets
        run: |
          SECRETS_JSON='${{ steps.get-app-secrets.outputs.MAGALU_CR }}'
          echo "MAGALU_USERNAME=$(echo $SECRETS_JSON | jq -r .docker-username)" >> $GITHUB_ENV
          echo "MAGALU_PASSWORD=$(echo $SECRETS_JSON | jq -r .docker-password)" >> $GITHUB_ENV

      - name: 'Debug: Verify AWS Identity'
        run: |
          echo "Verificando a identidade do IAM que o workflow está usando..."
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_database_url: ${{ steps.get-app-secrets.outputs.RAILS_DATABASE_URL }}
          TF_VAR_magalu_cr_username: ${{ env.MAGALU_USERNAME }}
          TF_VAR_magalu_cr_password: ${{ env.MAGALU_PASSWORD }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan
        env:
          TF_VAR_database_url: ${{ steps.get-app-secrets.outputs.RAILS_DATABASE_URL }}
          TF_VAR_magalu_cr_username: ${{ env.MAGALU_USERNAME }}
          TF_VAR_magalu_cr_password: ${{ env.MAGALU_PASSWORD }}

      - name: Get Kubeconfig Output and Save to Secrets Manager
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          KUBECONFIG_CONTENT=$(terraform output -raw cluster_kubeconfig_content)
          
          aws secretsmanager put-secret-value --secret-id ${{ env.SECRET_NAME }} --secret-string "$KUBECONFIG_CONTENT"
